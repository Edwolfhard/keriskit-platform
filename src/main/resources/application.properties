spring.application.name=keriskit

server.port=${PORT:8080}

spring.datasource.url=${KERISKIT_DB_URL:jdbc:postgresql://localhost:5433/keriskit}
spring.datasource.username=${KERISKIT_DB_USERNAME:keriskit}
spring.datasource.password=${KERISKIT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

keriskit.ollama.base-url=${KERISKIT_OLLAMA_BASE_URL:http://localhost:11434}
keriskit.ollama.model=${KERISKIT_OLLAMA_MODEL:llama3.2:3b}